<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Green background -->
  <circle cx="32" cy="32" r="32" fill="#1a6b3c"/>
  
  <!-- Photo frame icon (white) -->
  <rect x="12" y="14" width="40" height="36" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  
  <!-- Mountain/photo content inside -->
  <g clip-path="url(#clip)">
    <!-- Mountain peak (left) -->
    <polygon points="18,28 24,18 28,24" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Mountain peak (right) -->
    <polygon points="36,32 42,20 48,30" fill="#FFFFFF" opacity="0.7"/>
    
    <!-- Sun/light circle (compression concept) -->
    <circle cx="44" cy="22" r="4" fill="#FFFFFF" opacity="1"/>
  </g>
  
  <!-- Bottom bar (represents compression) -->
  <rect x="12" y="44" width="40" height="3" fill="#FFFFFF" opacity="0.5" rx="1.5"/>
  
  <!-- Compression arrows (subtle) -->
  <g opacity="0.8">
    <line x1="16" y1="46" x2="20" y2="46" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="19,44.5 20,46 19,47.5" fill="#FFFFFF"/>
    
    <line x1="44" y1="46" x2="48" y2="46" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="45,44.5 44,46 45,47.5" fill="#FFFFFF"/>
  </g>
  
  <defs>
    <clipPath id="clip">
      <rect x="12" y="14" width="40" height="30" rx="3"/>
    </clipPath>
  </defs>
</svg>